<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKL 坐标助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">SKL PLUGIN</p>
          <h1>坐标助手</h1>
        </div>
        <label class="switch" title="启用预登记坐标">
          <input id="enabled" type="checkbox" />
          <span aria-hidden="true"></span>
        </label>
      </header>

      <p id="summary" class="summary">尚未登记坐标</p>
      <section class="code-section" aria-labelledby="code-title">
        <div class="section-heading">
          <h2 id="code-title">签到码改写</h2>
        </div>
        <div class="code-form">
          <input
            id="code-override"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            pattern="[0-9]{4}"
            placeholder="4 位签到码"
            aria-label="输入后自动保存并改写请求的四位签到码"
          />
        </div>
        <p class="hint">仅改写签到验证接口 URL 中的 <code>code</code> 参数</p>
        <button id="sign-now" class="sign-now" type="button"> 签到 </button>
      </section>

      <section aria-labelledby="locations-title">
        <div class="section-heading">
          <h2 id="locations-title">预登记位置</h2>
          <span class="crs">WGS-84</span>
        </div>
        <div id="locations" class="locations"></div>
      </section>

      <details id="location-editor">
        <summary id="location-editor-title">添加位置</summary>
        <form id="location-form">
          <label>
            名称
            <input id="name" name="name" required maxlength="40" placeholder="例如：教室 A" />
          </label>
          <div class="coordinate-row">
            <label>
              纬度
              <input id="latitude" name="latitude" required type="number" min="-90" max="90" step="any" placeholder="30.xxxxxx" />
            </label>
            <label>
              经度
              <input id="longitude" name="longitude" required type="number" min="-180" max="180" step="any" placeholder="120.xxxxxx" />
            </label>
          </div>
          <label>
            精度半径（米）
            <input id="accuracy" name="accuracy" required type="number" min="1" step="1" value="20" />
          </label>
          <div class="form-actions">
            <button id="save-location" type="submit">保存位置</button>
            <button id="cancel-location-edit" class="secondary-button" type="button" hidden>
              取消编辑
            </button>
          </div>
        </form>
      </details>

      <section class="config-section" aria-labelledby="config-title">
        <div class="section-heading">
          <h2 id="config-title">配置文件</h2>
          <div class="config-actions">
            <button id="config-export" class="config-button" type="button">导出</button>
            <label class="config-button">
              导入
              <input id="config-import" type="file" accept="application/json,.json" />
            </label>
          </div>
        </div>
        <p class="hint">
          配置仅在点击“导出”后保存到浏览器的默认下载位置。
        </p>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <footer>切换位置后立即更新页面显示与后续签到请求，无需刷新。</footer>
    </main>
    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
